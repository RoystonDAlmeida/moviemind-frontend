# Base build settings
[build]
  command = "npm run build" # Or "yarn build" if you use yarn
  publish = "dist"          # Vite's default output directory
  environment = { NODE_VERSION = "18" } # Specify Node.js version if needed

# Redirect rule for Single Page Applications (SPAs) like React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200