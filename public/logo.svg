<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    
    <!-- Film strip gradient -->
    <linearGradient id="filmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e63" />
      <stop offset="100%" stop-color="#fb5b78" />
    </linearGradient>
    
    <!-- Title text gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff59c7" />
      <stop offset="50%" stop-color="#fa7ac8" />
      <stop offset="100%" stop-color="#b87aff" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="titleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" rx="20" fill="url(#bgGradient)" />
  
  <!-- Film Strip (Represents Movies) -->
  <g transform="translate(100, 110)">
    <!-- Film strip -->
    <rect x="0" y="0" width="300" height="80" rx="10" fill="#0b0c1a" stroke="url(#filmGradient)" stroke-width="3" />
    
    <!-- Film perforations -->
    <circle cx="35" cy="20" r="10" fill="#0b0c1a" stroke="url(#filmGradient)" stroke-width="2" />
    <circle cx="35" cy="60" r="10" fill="#0b0c1a" stroke="url(#filmGradient)" stroke-width="2" />
    <circle cx="265" cy="20" r="10" fill="#0b0c1a" stroke="url(#filmGradient)" stroke-width="2" />
    <circle cx="265" cy="60" r="10" fill="#0b0c1a" stroke="url(#filmGradient)" stroke-width="2" />
    
    <!-- MovieMind Text INSIDE the film strip - MORE VISIBLE -->
    <g filter="url(#titleGlow)" transform="translate(150, 46)">
      <text x="0" y="0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="42" font-weight="bold" fill="url(#titleGradient)" text-anchor="middle" style="letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,105,180,0.6);">
        MovieMind
      </text>
      
      <!-- Small sparkle effects -->
      <circle cx="-90" cy="-10" r="1.5" fill="white">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="90" cy="-8" r="1" fill="white">
        <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
  
  <!-- Brain icon representing AI -->
  <g transform="translate(225, 45) scale(0.06)">
    <path d="M512 224c0-35.3-28.7-64-64-64c-7.6 0-14.8 1.3-21.5 3.7c-13.7-24.7-39.8-41.3-69.8-41.3c-22.1 0-42.1 9-56.7 23.5c-14.7-14.5-34.7-23.5-56.7-23.5c-30.1 0-56.2 16.6-69.8 41.3c-6.7-2.4-13.9-3.7-21.5-3.7c-35.3 0-64 28.7-64 64c0 11.5 3.1 22.3 8.4 31.6c-5.3 9.3-8.4 20.1-8.4 31.6c0 14.9 5.1 28.7 13.9 39.7C98 341.6 96 358.2 96 376c0 11.5 8 39.4 64 88.9c55.4 48.9 147.7 83.4 222.9 86.8c6.5 0.3 13.1 0.3 21.1 0.2c-1.3-7.7-2-15.7-2-23.9c0-13.6 2-27.1 5.8-40h-3.8c-28.7 0-55.9-5.5-81.9-14.2c-27.9-9.3-52.4-23.2-73.2-41.5c-31.6-27.8-46.8-59.1-46.8-73.3c0-54.9 85.8-95 181-95s181 40.1 181 95c0 68.5-26.8 108.6-70.8 136.2c13.7 22.9 21.8 49.4 21.8 77.8c0 6.4-0.6 12.7-1.3 19c52.9-11.5 98.4-32.9 132-62.3c56-48.9 64-77.8 64-88.9c0-17.8-2-34.4-5.4-49.1c8.7-11 13.9-24.8 13.9-39.7c0-11.5-3.1-22.3-8.4-31.6c5.3-9.3 8.4-20.1 8.4-31.6z" fill="#fb5b78">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite" />
    </path>
  </g>
</svg>